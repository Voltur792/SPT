<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Мост Astra — грузится ПЕРВЫМ, до любых стилей (§8.3) -->
  <script src="http://astra-plugin.localhost/bridge/astra-bridge.js"></script>
  <meta charset="utf-8">
  <title>Sleep Pause Timer</title>
  <style>
    /* §8.2: три независимые вещи против «чёрного фона виджета».
       color-scheme на КОРНЕ оставляем normal — тёмная схема на корне
       заставляет браузер рисовать непрозрачный холст под документом. */
    :root {
      color-scheme: normal;

      /* Прозрачная подложка поверх токена темы. ВАЖНО: мы в iframe, поэтому
         backdrop-filter здесь не работает (за элементом внутри iframe пусто) —
         «стекло» даёт сама страница Астры, просвечивающая сквозь низкую альфу.
         Если у пользователя включен эффект стекла — фон уже размыт самой Астрой. */
      --glass: color-mix(in srgb, var(--color-surface, #808080) 12%, transparent);
      --glass-soft: color-mix(in srgb, var(--color-surface, #808080) 8%, transparent);
      --glass-hover: color-mix(in srgb, var(--color-surface, #808080) 24%, transparent);
      --stroke: var(--color-border, rgba(255, 255, 255, .09));
      --stroke-strong: var(--edge-control, rgba(255, 255, 255, .16));
      --focus-ring: var(--edge-focus, var(--color-accent, #8b5cf6));
      --text: var(--color-text, #f7f6ff);
      --text-soft: color-mix(in srgb, var(--color-text, #f7f6ff) 85%, transparent);
      --muted: var(--color-text-muted, #89869b);
      --accent: var(--color-accent, #8b5cf6);
      --radius-card: 17px;
      --radius-control: var(--radius-md, 13px);
    }
    body  { color-scheme: light dark; }   /* тёмные контролы — здесь, не на корне */
    html, body { background: transparent; }

    * { scrollbar-width: none; }          /* §8.4: скроллбаров не видно */
    *::-webkit-scrollbar { display: none; }

    body {
      margin: 0;
      font-family: var(--font-sans, 'Segoe UI', system-ui, sans-serif);
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
    }

    .card {
      box-sizing: border-box;
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      overflow: hidden;
      border: 1px solid var(--stroke);
      border-radius: var(--radius-card);
      /* лёгкий блик + прозрачная подложка: страница Астры просвечивает */
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .04), transparent 42%),
        var(--glass);
      box-shadow: inset 0 1px rgba(255, 255, 255, .04);
      transition: border-color .3s ease;
    }
    .card:hover { border-color: var(--stroke-strong); }

    /* глоу-блик по верхней грани — как .card::before у панелей Astra */
    .card::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 8%;
      width: 45%;
      height: 1px;
      opacity: .65;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .left { flex: 1 1 auto; min-width: 0; }

    .time {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: .5px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .18);
      transition: color .3s ease;
    }
    .time.paused { color: var(--muted); }

    .meta {
      margin-top: 3px;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar {
      margin-top: 7px;
      height: 5px;
      border-radius: 3px;
      background: color-mix(in srgb, var(--muted) 18%, transparent);
      overflow: hidden;
    }
    .bar .fill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: var(--accent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent);
      transition: width .4s linear;
    }

    .btns { display: flex; gap: 8px; flex: 0 0 auto; }

    /* §8.4: кнопки рисуем сами — пилюли в стиле .status у панелей Astra */
    .btn {
      box-sizing: border-box;
      min-width: 36px;
      height: 30px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-hover);
      box-shadow: inset 0 1px rgba(255, 255, 255, .035);
      color: var(--text-soft);
      cursor: pointer;
      outline: none;
      transition: border-color .25s ease, background .25s ease, transform .25s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--stroke-strong);
      background: color-mix(in srgb, var(--color-surface, #808080) 34%, transparent);
    }
    .btn:focus-visible { box-shadow: 0 0 0 2px var(--focus-ring); }
    .btn.danger:hover { border-color: rgba(255, 113, 133, .35); color: #ffc0ca; }

    .idle {
      box-sizing: border-box;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 12px;
      border: 1px solid var(--stroke);
      border-radius: var(--radius-card);
      background: var(--glass-soft);
      box-shadow: inset 0 1px rgba(255, 255, 255, .03);
    }

    /* до двух строк — ничего не обрезаем */
    .idle span {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      line-height: 1.45;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card hidden" id="card">
    <div class="left">
      <div class="time" id="time">00:00</div>
      <div class="meta" id="meta"></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
    <div class="btns">
      <div class="btn" id="btnPause" role="button" tabindex="0" title="Пауза / продолжить">⏸</div>
      <div class="btn danger" id="btnCancel" role="button" tabindex="0" title="Отменить таймер">✕</div>
    </div>
  </div>

  <div class="idle" id="idle"><span>⏱ Таймер не запущен — попросите Астру поставить таймер</span></div>

  <script>
    // Мост ищем при каждом вызове: он может загрузиться позже самого документа.
    // Поддержаны window.astra (текущий контракт) и window.__astraBridge (запасное).
    const call = (method, params) => {
      const api = window.astra || window.__astraBridge || null;
      const fn = api && (api.callBackend || api.call);
      return fn ? fn.call(api, method, params)
                : Promise.reject(new Error('bridge not ready'));
    };

    const ACTION_LABELS = {
      playpause: '⏯ play/pause',
      shutdown: '🔴 выключение',
      sleep: '💤 сон'
    };

    const el = {
      card: document.getElementById('card'),
      idle: document.getElementById('idle'),
      time: document.getElementById('time'),
      meta: document.getElementById('meta'),
      fill: document.getElementById('fill'),
      pause: document.getElementById('btnPause'),
      cancel: document.getElementById('btnCancel')
    };

    let last = null;

    function render(s) {
      if (!s) return;
      last = s;
      const running = !!s.running;
      el.card.classList.toggle('hidden', !running);
      el.idle.classList.toggle('hidden', running);
      if (!running) return;

      const h = Math.floor(s.remaining_seconds / 3600);
      const m = Math.floor((s.remaining_seconds % 3600) / 60);
      const sec = s.remaining_seconds % 60;
      const pad = n => String(n).padStart(2, '0');
      el.time.textContent = h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
      el.time.classList.toggle('paused', !!s.paused);

      const action = ACTION_LABELS[s.action] || s.action || '';
      const win = s.window ? ` · ${s.window}` : '';
      el.meta.textContent = (s.paused ? '⏸ пауза · ' : '') + action + win;

      const total = Math.max(1, s.total_seconds || 1);
      const done = Math.min(100, Math.max(0, (1 - s.remaining_seconds / total) * 100));
      el.fill.style.width = done.toFixed(1) + '%';

      el.pause.textContent = s.paused ? '▶' : '⏸';
      el.pause.title = s.paused ? 'Продолжить' : 'Пауза';
    }

    async function tick() {
      try { render(await call('state', {})); } catch (e) { /* мост ещё не готов */ }
    }

    el.pause.addEventListener('click', async () => {
      try { render(await call(last && last.paused ? 'resume' : 'pause', {})); } catch (e) {}
    });
    el.cancel.addEventListener('click', async () => {
      try { render(await call('cancel', {})); } catch (e) {}
    });
    // Клавиатура: Enter/Space нажимают кнопку
    for (const [node, fn] of [[el.pause, () => el.pause.click()], [el.cancel, () => el.cancel.click()]]) {
      node.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fn(); }
      });
    }

    tick();
    setInterval(tick, 500);
  </script>
</body>
</html>
