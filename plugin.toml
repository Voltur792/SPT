[plugin]
id = "sleep-pause-timer"
name = "Sleep Pause Timer"
version = "1.1.0"
description = "Independent countdowns with custom actions, music alarms, Smart Home schedules, desktop timer and alarm widgets, inactivity tracking, and optional screen comments."
author = "Voltur"
license = "MIT"

[entry]
# `python` — известный демонстру рантайм: Астра сама находит Python (или
# предложит установить), создаёт виртуальное окружение плагина из
# requirements.lock и запускает код в нём. Это единственная форма, которую
# принимает бандл .astraplugin (пути вида .venv/... или {venv}/... в него
# не попадают).
command = "python"
args = ["-m", "src.plugin"]
runtimes = ["python"]

# `[capabilities]` — то, что демон может вызывать В плагине.
[capabilities]
tools = true
triggers = true
ui_contributions = true

# Запрос снимка инструментом Astra и комментария через канал сообщений плагина.
[permissions]
fire_trigger = { reason = "Runs user-configured Astra automations when a named countdown completes" }
send_chat_message = { reason = "Asks Astra to take a screenshot and speak a short comment about your current activity at the interval you enable" }

# Настройки — Астра сама рисует форму из этой JSON-схемы.
[config]
schema = '''{"type":"object","properties":{"default_action":{"type":"string","enum":["playpause","shutdown","sleep"],"default":"playpause","title":"Действие по завершении таймера","description":"Что сделать, когда таймер дойдёт до нуля: нажать play/pause, выключить ПК или усыпить его"},"default_window":{"type":"string","default":"","title":"Окно для активации","description":"Подстрока заголовка окна или номер #N из list_windows — окно активируется перед нажатием media-клавиши"},"alarm_sound_path":{"type":"string","default":"","title":"Мелодия будильника","description":"Полный путь к аудиофайлу (MP3, WAV, WMA, M4A, AAC, MIDI) для будильника"},"alarm_repeat":{"type":"boolean","default":true,"title":"Повторять ежедневно","description":"Если включено, будильник срабатывает каждый день в заданное время"}},"additionalProperties":true}'''

[platform]
os = ["windows"]
arch = ["x86_64"]
