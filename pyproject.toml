[project]
name = "sleep_pause_timer"
version = "1.3.0"
description = "An Astra plugin"
requires-python = ">=3.10"
dependencies = [
    "astra-plugin-sdk>=0.6,<0.7",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "Pillow>=11.3,<12",
    "pywebview[qt]>=6,<7; sys_platform == \"linux\"",
    "pywebview>=6,<7; sys_platform == \"darwin\"",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"`, then `pytest`. The harness itself ships in the SDK,
# so this extra adds the runner and nothing else.
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
