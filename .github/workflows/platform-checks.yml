name: Platform checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ASTRA_MUSIC_NATIVE_PLAYER: '0'
      AA_DATA_DIR: ${{ runner.temp }}/astra-platform-tests/assistant
      ASTRA_MUSIC_DATA_DIR: ${{ runner.temp }}/astra-platform-tests/music
      SPT_ALARM_STATE_DIR: ${{ runner.temp }}/astra-platform-tests/timer
      SPT_INTEGRATION_DIR: ${{ runner.temp }}/astra-platform-tests/integrations
      YSH_DATA_DIR: ${{ runner.temp }}/astra-platform-tests/home
      YSH_COMMANDS_FILE: ${{ runner.temp }}/astra-platform-tests/commands.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libpulse0 python3-tk libegl1 libopengl0
      - run: python -m pip install -r requirements.lock pytest
      - name: Import and compile
        run: python -m compileall -q src
      - name: Offline tests (system actions and accounts mocked)
        run: python -m pytest tests -q --tb=short
